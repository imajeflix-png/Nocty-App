<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0D" />
    <title>Nocty — Immersive Music Player</title>
    <meta
      name="description"
      content="Pemutar musik web ringan dan imersif dengan streaming audio penuh, penyimpanan MP3 lokal permanen, dan lirik sinkron otomatis."
    />
    <meta property="og:title" content="Nocty — Immersive Music Player" />
    <meta
      property="og:description"
      content="Pemutar musik web ringan dan imersif dengan streaming audio penuh, penyimpanan MP3 lokal permanen, dan lirik sinkron otomatis."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nocty" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedMode = localStorage.getItem('nocty_theme_mode');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            savedMode === 'light' || savedMode === 'dark'
              ? savedMode
              : prefersDark
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', resolved === 'dark' ? '#0B0B0D' : '#F2F4F8');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (src.indexOf('chrome-extension://') === 0 || stack.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body class="bg-[#F2F4F8] dark:bg-[#0B0B0D] text-[#111318] dark:text-[#F5F5F7] antialiased selection:bg-slate-900/15 dark:selection:bg-white/25 selection:text-[#111318] dark:selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
